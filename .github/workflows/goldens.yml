# Re-record the screenshot goldens (Roborazzi) on GitHub and commit them to the branch, so a
# visual change can land without recording on a local machine:
#
#   gh workflow run goldens.yml --ref <branch>
#
# Never on master. A push made with the workflow token starts no other workflow, so this one
# starts CI on its new commit itself. Review the new goldens by eye in the commit's diff (small
# phone at 2x font, phone, tablet, landscape), as for a local re-record.
#
# Retired goldens (a test renamed or removed) are not deleted here: the job summary lists every
# checked-in golden that this run didn't write, for a person to remove.
name: Record goldens

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: goldens-${{ github.ref }}

jobs:
  record:
    name: Record goldens
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Record
        run: |
          touch "$RUNNER_TEMP/before-record"
          ./gradlew recordRoborazziDebug

      - name: List goldens this run didn't write
        run: |
          stale="$(find . -path '*/src/test/screenshots/*.png' ! -newer "$RUNNER_TEMP/before-record" | sort)"
          {
            echo "### Goldens not written by this run"
            if [[ -n "$stale" ]]; then
              echo "Probably retired (their test was renamed or removed); delete them if so:"
              echo '```'; echo "$stale"; echo '```'
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and start CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- '*/src/test/screenshots/'
          if git diff --cached --quiet; then
            echo "No golden changed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Re-record screenshot goldens (CI, run ${{ github.run_id }})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
