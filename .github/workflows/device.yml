# The device tour (scripts/device/tour.sh) on a headless emulator in GitHub Actions, so the tour
# needs no local machine. Same AVD as local runs: boot.sh creates it (API 34
# google_apis_playstore x86_64, 1080x2400 @ 420dpi) and applies the same settings.
#
# Runs on every pull request (debug and release side by side), and by hand:
#   gh workflow run device.yml --ref <branch> [-f variant=debug|release|both] [-f only=step,step]
#
# The device matrix (scripts/device/matrix.sh: the tour's steps on several screen sizes, font
# scales and rotations, docs/TESTING.md section 10) runs by hand only, as its own job:
#   gh workflow run device.yml --ref <branch> -f job=matrix [-f profiles=focused|daily|all|a,b]
# The opt-in profiles: -f profiles=soft-keyboard (the full-height soft keyboard, on its own AVD;
# a run of its own) and -f profiles=tablet-ignore (a tablet that ignores orientation requests).
# Dispatched runs with different inputs run side by side; the same inputs again replace the
# earlier run.
#
# Measure (by hand only): what the release build weighs and how fast it starts, for the code grade.
#   gh workflow run device.yml --ref <branch> -f job=measure
# It builds the release APK with the Compose compiler reports on (-PcomposeReports, never on in a
# real release), runs scripts/dev/measure.sh (the APK by kind, method references, dex bytes by
# library, the runtime dependency tree, Compose stability), then times cold starts on the tour's
# emulator (scripts/device/startup.sh). The run's summary page shows the results.
#
# Not a required check yet. The report (screenshots, ui dumps, logcat, tour.log) is uploaded as an
# artifact either way. The release build is debug-signed here, since CI has no keystore.
name: Device tour
# In the runs list: a dispatched run says what it runs; a pull request's keeps the PR's title.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Device {0} on {1}', inputs.job == 'tour' && format('tour ({0})', inputs.variant) || inputs.job == 'matrix' && format('matrix ({0})', inputs.profiles) || inputs.job == 'measure' && 'measure' || format('tour ({0}) and matrix ({1})', inputs.variant, inputs.profiles), github.ref_name) || github.event.pull_request.title }}"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which build to tour"
        type: choice
        options: [both, debug, release]
        default: both
      only:
        description: "Optional: only these steps, comma-separated (tour.sh --list names them)"
        type: string
        default: ""
      job:
        description: "The tour, the device matrix, or both; or measure (size and cold start)"
        type: choice
        options: [tour, matrix, both, measure]
        default: tour
      profiles:
        description: "Matrix only: a set (focused, daily, all) or profiles, comma-separated (matrix.sh --list)"
        type: string
        default: focused

permissions:
  contents: read

# One run per pull request; by hand, one per branch and set of inputs (a soft-keyboard matrix and a
# tablet-ignore one run side by side, and neither cancels the pull request's tour).
concurrency:
  group: device-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}-{2}-{3}', inputs.job, inputs.variant, inputs.profiles, inputs.only) || '' }}
  cancel-in-progress: true

jobs:
  tour:
    name: Device tour (${{ matrix.variant }})
    if: github.event_name == 'pull_request' || inputs.job == 'tour' || inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.variant != 'both') && format('["{0}"]', inputs.variant) || '["debug","release"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator and system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install emulator platform-tools \
            "system-images;android-34;google_apis_playstore;x86_64" > /dev/null

      - name: Tour (${{ matrix.variant }})
        env:
          VARIANT: ${{ matrix.variant }}
          ONLY: ${{ inputs.only }}
          PP_BOOT_TIMEOUT: "600"
        run: |
          args=(--stop)
          if [[ "$VARIANT" == release ]]; then args+=(--release); fi
          if [[ -n "$ONLY" ]]; then args+=(--only "$ONLY"); fi
          scripts/device/tour.sh "${args[@]}"

      # The failing step's screen as text, so a failure can be read from the log alone.
      - name: Show the failing screen
        if: failure()
        run: |
          dir="$(ls -d build/device-reports/2* 2>/dev/null | tail -1)"
          [[ -n "$dir" ]] || exit 0
          xml="$(ls -t "$dir"/[0-9]*.xml 2>/dev/null | head -1)"
          if [[ -n "$xml" ]]; then
            echo "== Text on screen at the failure ($(basename "$xml")): text | description | bounds"
            python3 - "$xml" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          for n in ET.parse(sys.argv[1]).iter('node'):
              t, d = n.get('text') or '', n.get('content-desc') or ''
              if t or d:
                  print(f"{t!r} | {d!r} | {n.get('bounds')}")
          EOF
          fi
          echo "== End of tour.log"
          tail -60 "$dir/tour.log"
          if [[ -f "$dir/logcat.txt" ]]; then
            echo "== Last app and window lines in logcat"
            grep -E "pokerpayout|WindowManager|ActivityTaskManager|ActivityManager|InputDispatcher|Orientation|rotation" \
              "$dir/logcat.txt" | tail -80 || true
          fi

      - name: Upload the tour report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-tour-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/device-reports/
            build/device/*.log
          if-no-files-found: ignore
          retention-days: 14

  matrix:
    # By hand only. The focused set is untimed on 1.3.4: an estimated 40 to 50 minutes on a quiet
    # local machine, longer here.
    # The debug build, or the release build with variant=release.
    # A plain name: a skipped job (every pull request) shows its name unevaluated, so the profiles
    # in it showed on PRs as the raw expression. They are in the step's name and the run's name.
    name: Device matrix
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'matrix' || inputs.job == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator and system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install emulator platform-tools \
            "system-images;android-34;google_apis_playstore;x86_64" > /dev/null

      - name: Pillow (the layout checks' pictures and the contact sheet)
        run: |
          { sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil; } > /dev/null \
            || echo "no Pillow: the pixel checks are skipped"

      - name: Matrix (${{ inputs.profiles }})
        env:
          VARIANT: ${{ inputs.variant }}
          PROFILES: ${{ inputs.profiles }}
          PP_BOOT_TIMEOUT: "600"
        run: |
          args=(--stop --profiles "${PROFILES:-focused}")
          if [[ "$VARIANT" == release ]]; then args+=(--release); fi
          scripts/device/matrix.sh "${args[@]}"

      # Every failed step of every profile, so a failure can be read from the log alone: what the
      # step logged (its section of tour.log) and the text on screen after it (its dump).
      - name: Show the failing steps
        if: failure()
        run: |
          dir="$(ls -d build/device-reports/matrix-2* 2>/dev/null | tail -1)"
          [[ -n "$dir" ]] || exit 0
          python3 - "$dir" <<'EOF'
          import os, sys, xml.etree.ElementTree as ET
          top = sys.argv[1]
          for prof in sorted(os.listdir(top)):
              pdir = os.path.join(top, prof)
              tsv = os.path.join(pdir, "steps.tsv")
              if not os.path.isfile(tsv):
                  continue
              rows = [l.rstrip("\n").split("\t") for l in open(tsv, encoding="utf-8")][1:]
              log = open(os.path.join(pdir, "tour.log"), encoding="utf-8", errors="replace").read().splitlines() \
                  if os.path.exists(os.path.join(pdir, "tour.log")) else []
              for row in rows:
                  if len(row) < 3 or row[2] != "FAIL":
                      continue
                  sid = row[0]
                  print("::group::%s %s: %s" % (prof, sid, row[4] if len(row) > 4 else ""))
                  start = next((i for i, l in enumerate(log) if l.startswith("=== %s:" % sid)), None)
                  if start is not None:
                      end = next((i for i in range(start + 1, len(log)) if log[i].startswith("=== ")), len(log))
                      print("\n".join(log[start:end][-60:]))
                  xml = os.path.join(pdir, sid + ".xml")
                  if os.path.exists(xml):
                      print("-- text on screen after it: text | description | bounds")
                      try:
                          shown = 0
                          for n in ET.parse(xml).iter("node"):
                              t, d = n.get("text") or "", n.get("content-desc") or ""
                              if (t or d) and shown < 80:
                                  print("%r | %r | %s" % (t, d, n.get("bounds")))
                                  shown += 1
                      except ET.ParseError:
                          print("(unreadable dump)")
                  print("::endgroup::")
          EOF

      - name: Upload the matrix report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/device-reports/
            build/device/*.log
          if-no-files-found: ignore
          retention-days: 14

  measure:
    # By hand only (-f job=measure). About 25 minutes: the release build, then 16 cold starts.
    name: Measure
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Release APK, with the Compose compiler reports
        run: ./gradlew :app:assembleRelease -PcomposeReports --console=plain

      - name: Runtime dependency tree
        run: |
          mkdir -p build/measure
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain \
            > build/measure/deps-release.txt

      - name: What the APK is made of
        run: |
          scripts/dev/measure.sh build/measure > /dev/null
          cat build/measure/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator and system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install emulator platform-tools \
            "system-images;android-34;google_apis_playstore;x86_64" > /dev/null

      - name: Cold start
        env:
          PP_BOOT_TIMEOUT: "600"
        run: |
          scripts/device/boot.sh
          scripts/device/install.sh --release --no-build
          sleep 60 # let the boot's background work (other apps' dexopt, Play services) settle
          scripts/device/startup.sh 8
          cat build/device/startup.md >> "$GITHUB_STEP_SUMMARY"
          scripts/device/stop.sh || true

      - name: Upload the measurements
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: measure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/measure/
            build/device/startup.md
            build/device/*.log
            */build/compose-reports/
            */build/compose-metrics/
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: ignore
          retention-days: 14
