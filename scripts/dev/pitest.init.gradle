// Mutation testing (PIT) for :core, without touching the build: applied only by this init script,
// so the app's own build, its dependencies and F-Droid's reproducible build never see it.
//
//   ./gradlew --init-script scripts/dev/pitest.init.gradle :core:pitestDebug
//
// Report: core/build/reports/pitest/debug/ (index.html, mutations.xml). GitHub runs it by hand:
// .github/workflows/mutation.yml. Mutates the money, settlement, bounty and blind maths
// (core.domain, core.utils) and runs only the plain JVM tests against them: the Robolectric ones
// are slow to fork and add nothing for pure code.

initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'pl.droidsonroids.gradle:gradle-pitest-plugin:0.2.27'
    }
}

gradle.beforeProject { project ->
    if (project.path != ':core') return
    project.pluginManager.withPlugin('com.android.library') {
        project.apply plugin: pl.droidsonroids.gradle.pitest.PitestPlugin
        project.pitest {
            pitestVersion = '1.20.7'
            junit5PluginVersion = '1.2.3'
            targetClasses = [
                'com.huntercoles.pokerpayout.core.domain.*',
                'com.huntercoles.pokerpayout.core.utils.*',
            ]
            excludedClasses = [
                '*.domain.history.NightStore*',   // SharedPreferences
                '*.utils.ExtensionsFlowLifecycle*', // lifecycle glue
                '*.utils.ChipSetProvider*',
                '*.utils.BlindScheduleProvider*',
                '*_Factory*',
                '*Hilt*',
            ]
            // Kotlin writes these for every data class; mutating them says nothing about the maths
            excludedMethods = ['toString', 'hashCode', 'equals', 'component*', 'copy', 'copy$default']
            targetTests = [
                'com.huntercoles.pokerpayout.core.domain.*',
                'com.huntercoles.pokerpayout.core.utils.*',
                'com.huntercoles.pokerpayout.core.property.*',
            ]
            excludedTestClasses = ['*NightCodecTest', '*NightStoreTest', '*HistoryPropertiesTest']
            threads = Runtime.runtime.availableProcessors()
            outputFormats = ['HTML', 'XML']
            timestampedReports = false
            failWhenNoMutations = false
            jvmArgs = ['-Xmx1g', '-Duser.language=en', '-Duser.country=US']
        }
    }
}
