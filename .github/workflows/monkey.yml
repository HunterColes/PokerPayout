# Chaos testing: `adb shell monkey` against the debug build on a headless emulator in GitHub Actions
# (scripts/device/monkey.sh). Fixed seeds, logged, so a failure replays exactly; restricted to the
# app's package; fails on a crash or an ANR in the app. The same AVD as the device tour.
#
# Runs on every pull request, and by hand:
#   gh workflow run monkey.yml --ref <branch> [-f seeds=1,2,3] [-f events=4000] [-f variant=debug|release]
#
# Not a required check. The report (summary.md, each seed's monkey log and logcat, the screen at a
# failure) is uploaded as an artifact either way.
name: Monkey
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Monkey ({0}, seeds {1}) on {2}', inputs.variant, inputs.seeds, github.ref_name) || github.event.pull_request.title }}"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Monkey seeds, comma-separated (each run replays exactly)"
        type: string
        default: "20261008,1204,35"
      events:
        description: "Events per seed"
        type: string
        default: "4000"
      variant:
        description: "Which build"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: monkey-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}-{2}', inputs.variant, inputs.seeds, inputs.events) || '' }}
  cancel-in-progress: true

jobs:
  monkey:
    name: Monkey (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator and system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install emulator platform-tools \
            "system-images;android-34;google_apis_playstore;x86_64" > /dev/null

      - name: Monkey
        env:
          SEEDS: ${{ inputs.seeds || '20261008,1204,35' }}
          EVENTS: ${{ inputs.events || '4000' }}
          VARIANT: ${{ inputs.variant || 'debug' }}
          PP_BOOT_TIMEOUT: "600"
        run: |
          args=(--stop --seeds "$SEEDS" --events "$EVENTS")
          if [[ "$VARIANT" == release ]]; then args+=(--release); fi
          scripts/device/monkey.sh "${args[@]}"

      - name: Show the report
        if: success() || failure()
        run: |
          dir="$(ls -d build/device-reports/monkey-* 2>/dev/null | tail -1)"
          [[ -n "$dir" && -f "$dir/summary.md" ]] || exit 0
          cat "$dir/summary.md"
          cat "$dir/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the monkey report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-${{ inputs.variant || 'debug' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/device-reports/monkey-*/
            build/device/*.log
          if-no-files-found: ignore
          retention-days: 14
