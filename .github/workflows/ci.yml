# Unit tests, Android Lint and detekt on every push and pull request.
#
# Lint and detekt fail only on findings that aren't in the checked-in baselines
# (<module>/lint-baseline.xml, <module>/detekt-baseline.xml). The unit-test task fails if a module
# runs fewer tests than it declares (see the root build.gradle.kts).
#
# The unit-test step also verifies the screenshot goldens (<module>/src/test/screenshots, Roborazzi;
# roborazzi.test.verify=true in gradle.properties), so a visual change fails CI until someone
# re-records the goldens on purpose with ./gradlew recordRoborazziDebug. On a failure the
# reference | diff | new images are uploaded with the reports (build/outputs/roborazzi).
#
# No secrets are used, and the token is read-only, so pull requests from forks run the same job.
name: CI

on:
  push:
    branches: ["**"] # every branch; tag pushes (releases) are covered by the commit's own run
  pull_request:
  workflow_dispatch: # goldens.yml starts it after committing re-recorded goldens

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, detekt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle state (read-only outside the default branch) and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and screenshot goldens (all modules)
        run: ./gradlew testDebugUnitTest --continue

      - name: Android Lint (new issues only)
        if: success() || failure()
        run: ./gradlew lintDebug --continue

      - name: detekt (new issues only)
        if: success() || failure()
        run: ./gradlew detekt --continue

      - name: Upload test, lint and detekt reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            */build/reports/
            */build/test-results/
            */build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14
