// Types the Compose compiler treats as stable in every module (root build.gradle.kts wires it).
//
// Read-only collections: UI states hold lists, sets and maps that are built once and never
// changed in place (a change makes a new state, and StateFlow drops a state equal to the last).
// Stable, a composable that gets an equal list skips; without this, Compose compared lists by
// identity, so a list rebuilt each second (the clock's setup strip, its stats) recomposed its
// whole row on every tick.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection
