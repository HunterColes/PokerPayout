# Gradle properties
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms3g -Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true

# Application properties
android.useAndroidX=true
# Disable baseline profile generation for F-Droid reproducible builds
android.enableProfileInstaller=false
systemProp.android.enableProfileInstaller=false
kotlin.code.style=official
# Kotlin sources in src/testFixtures (core's shared screenshot-test kit).
android.experimental.enableTestFixturesKotlinSupport=true

# Screenshot tests: plain `testDebugUnitTest` (the CI gate) verifies the committed goldens, so a
# visual change fails until someone runs `recordRoborazziDebug` on purpose. The record, compare and
# verify tasks override this. See docs/TESTING.md.
roborazzi.test.verify=true

# Release signing configuration (use environment variables)
# Set these environment variables for signed builds:
# ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=../pokerpayout-release.keystore
# ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=your_password
# ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=pokerpayout
# ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=your_password
