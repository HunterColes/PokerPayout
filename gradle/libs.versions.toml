[versions]
# plugins
android-gradle                      = "8.7.2"
detekt                              = "1.23.7"
junit                               = "1.11.2.0"
ksp                                 = "2.0.21-1.0.28"
ktlint                              = "4.5.0"

# production libraries
compose-bom                         = "2024.11.00"
compose-rules                       = "0.4.19"
compose-material3                   = "1.3.1"
hilt                                = "2.52"
kotlin                              = "2.0.21"
kotlin-coroutines                   = "1.9.0"
kotlin-serialization                = "1.7.3"
lifecycle                           = "2.8.7"
navigation                          = "2.8.2"
navigation-hilt                     = "1.2.0"
timber                              = "5.0.1"

# test libraries
test-junit                          = "5.11.3"
test-mockk                          = "1.13.13"
test-robolectric                    = "4.14.1"
# 1.60.0 is the newest Roborazzi whose Kotlin metadata (2.0) Kotlin 2.0.21 can read; 1.61.0+ is 2.3.
# Take the latest once Kotlin is >= 2.2 (PP-023).
test-roborazzi                      = "1.60.0"
test-androidx-core                  = "1.6.1"

# android test libraries
test-android-compose-ui-test        = "1.7.5"
test-android-junit                  = "1.2.1"
test-android-runner                 = "1.6.2"


[plugins]
android-application                 = { id = "com.android.application", version.ref = "android-gradle" }
android-library                     = { id = "com.android.library", version.ref = "android-gradle" }
detekt                              = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
hilt                                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
junit                               = { id = "de.mannodermaus.android-junit5", version.ref = "junit" }
kotlin                              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose-compiler             = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize                    = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serialization                = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint                              = { id = "org.jmailen.kotlinter", version.ref = "ktlint" }
roborazzi                           = { id = "io.github.takahirom.roborazzi", version.ref = "test-roborazzi" }


[libraries]
# production libraries
compose-bom                         = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3                   = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-rules                       = { group = "io.nlopez.compose.rules", name = "ktlint", version.ref = "compose-rules" }
compose-ui-tooling-preview          = { group = "androidx.compose.ui", name = "ui-tooling-preview" } # @Preview; version from the BOM
hilt                                = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
kotlin-coroutines                   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }
kotlin-serialization                = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlin-serialization" }
lifecycle-runtime-compose           = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation                          = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
navigation-hilt                     = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "navigation-hilt" }
timber                              = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# test libraries
test-junit                          = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "test-junit" }
test-junit4                         = { group = "junit", name = "junit", version = "4.13.2" }
test-junit-vintage                  = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "test-junit" } # runs the JUnit4/Robolectric tests on the JUnit Platform
test-kotlin                         = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
test-kotlin-coroutines              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
test-mockk                          = { group = "io.mockk", name = "mockk", version.ref = "test-mockk" }
test-mockk-agent                   = { group = "io.mockk", name = "mockk-agent-jvm", version.ref = "test-mockk" }
test-robolectric                    = { group = "org.robolectric", name = "robolectric", version.ref = "test-robolectric" }
test-androidx-core                  = { group = "androidx.test", name = "core", version.ref = "test-androidx-core" }
test-compose-ui                     = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "test-android-compose-ui-test" } # Compose UI tests on the JVM (Robolectric)
test-roborazzi                      = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "test-roborazzi" }
test-roborazzi-compose              = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "test-roborazzi" }
test-roborazzi-junit-rule           = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "test-roborazzi" }

# android test libraries
test-android-compose                = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "test-android-compose-ui-test" }
test-android-hilt                   = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
test-android-junit                  = { group = "androidx.test.ext", name = "junit", version.ref = "test-android-junit" } # for @RunWith(AndroidJUnit4::class)
test-android-runner                 = { group = "androidx.test", name = "runner", version.ref = "test-android-runner" }

# debug libraries
debug-compose-manifest              = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "test-android-compose-ui-test" }
debug-compose-ui-tooling            = { group = "androidx.compose.ui", name = "ui-tooling" } # renders @Preview in Android Studio; version from the BOM


[bundles]
common-test = [
    "test-junit",
    "test-junit4",
    "test-junit-vintage",
    "test-kotlin",
    "test-kotlin-coroutines",
    "test-mockk",
    "test-mockk-agent"
]
screenshot-test = [
    "test-compose-ui",
    "test-robolectric",
    "test-roborazzi",
    "test-roborazzi-compose",
    "test-roborazzi-junit-rule"
]
common-android-test = [
    "test-android-compose",
    "test-android-hilt",
    "test-android-runner"
]
